name: Sync LinkedIn posts from Buffer

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"

permissions:
  contents: write

concurrency:
  group: sync-buffer-posts
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the site
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch recent LinkedIn posts
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: node scripts/sync-buffer-posts.mjs

      - name: Publish feed changes
        run: |
          if git diff --quiet -- assets/linkedin-posts.json; then
            echo "LinkedIn feed is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/linkedin-posts.json
          git commit -m "Update LinkedIn posts from Buffer"
          git pull --rebase origin main
          git push origin HEAD:main
